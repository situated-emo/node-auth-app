<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container { width: 100%; max-width: 800px; background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 600; color: #334155; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; width: auto; margin-right: 0.25rem; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    select, .table-input { padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main class="admin-container">
    <div class="header-bar">
      <h1>Управление пользователями</h1>
      <button id="logoutBtn" class="btn-sm btn-danger">Выйти</button>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Имя пользователя</th>
            <th>Роль</th>
            <th>Дата регистрации</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Сюда загрузятся пользователи -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // Загрузка списка пользователей
    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      if (!res.ok) {
        alert('Нет доступа');
        window.location.href = '/index.html';
        return;
      }
      const users = await res.json();
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.id}</td>
          <td><input type="text" class="table-input" id="name-${user.id}" value="${user.username}"></td>
          <td>
            <select id="role-${user.id}">
              <option value="user" ${user.role === 'user' ? 'selected' : ''}>user</option>
              <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>admin</option>
            </select>
          </td>
          <td>${new Date(user.created_at).toLocaleDateString()}</td>
          <td>
            <button class="btn-sm" onclick="saveUser(${user.id})">Сохранить</button>
            <button class="btn-sm btn-danger" onclick="deleteUser(${user.id})">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Сохранение изменений
    async function saveUser(id) {
      const username = document.getElementById(`name-${id}`).value;
      const role = document.getElementById(`role-${id}`).value;

      const res = await fetch(`/api/admin/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, role })
      });

      const data = await res.json();
      alert(data.message || data.error);
      loadUsers();
    }

    // Удаление пользователя
    async function deleteUser(id) {
      if (!confirm('Точно удалить этого пользователя?')) return;

      const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message || data.error);
      loadUsers();
    }

    // Выход из системы
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    loadUsers();
  </script>
</body>
</html>
