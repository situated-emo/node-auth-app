<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container { width: 100%; max-width: 850px; background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 600; color: #334155; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; width: auto; margin-right: 0.25rem; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    select, .table-input { padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .tabs { display: flex; gap: 0.5rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; padding-bottom: 0.5rem; }
    .tab-btn { background: #f1f5f9; color: #475569; width: auto; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; }
    .tab-btn.active { background: #2563eb; color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <main class="admin-container">
    <div class="header-bar">
      <h1>Управление пользователями</h1>
      <button id="logoutBtn" class="btn-sm btn-danger">Выйти</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('users', this)">Пользователи</button>
      <button class="tab-btn" onclick="switchTab('trash', this)">Корзина</button>
    </div>

    <section id="tab-users" class="tab-panel active">
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя</th>
              <th>Роль</th>
              <th>Дата</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Сюда загрузятся пользователи -->
          </tbody>
        </table>
      </div>
    </section>
    <section id="tab-trash" class="tab-panel">
      <h3>Удалённые пользователи</h3>
      <div style="overflow-x: auto; margin-bottom: 2rem;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя</th>
              <th>Роль</th>
              <th>Удалён</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="trashUsersBody"></tbody>
        </table>
      </div>

      <h3>Удалённые задачи</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Проект</th>
              <th>Автор</th>
              <th>Удалена</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="trashTasksBody"></tbody>
        </table>
      </div>
    </section>
  <h2 style="margin-top: 2rem;">Журнал активности</h2>
  <ul id="activityList" style="list-style: none; padding: 0; margin-top: 0.5rem;"></ul>
  </main>

  <script>
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if (tabName === 'trash') loadTrash();
      if (tabName === 'users') loadUsers();
    }
    // Загрузка списка пользователей
    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      if (!res.ok) {
        alert('Нет доступа');
        window.location.href = '/index.html';
        return;
      }
      const users = await res.json();
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.id}</td>
          <td><input type="text" class="table-input" id="name-${user.id}" value="${user.username}"></td>
          <td>
            <select id="role-${user.id}">
              <option value="viewer" ${user.role === 'viewer' ? 'selected' : ''}>viewer</option>
              <option value="user" ${user.role === 'user' ? 'selected' : ''}>user</option>
              <option value="manager" ${user.role === 'manager' ? 'selected' : ''}>manager</option>
              <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>admin</option>
            </select>
          </td>
          <td>${new Date(user.created_at).toLocaleDateString()}</td>
          <td>
            <button class="btn-sm" onclick="saveUser(${user.id})">Сохранить</button>
            <button class="btn-sm btn-danger" onclick="deleteUser(${user.id})">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Сохранение изменений
    async function saveUser(id) {
      const role = document.getElementById(`role-${id}`).value;

      const res = await fetch(`/api/admin/users/${id}/role`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role })
      });

      const data = await res.json();
      alert(data.message || data.error || 'Роль обновлена');
      loadUsers();
      renderActivity();
    }

    // Удаление пользователя
    async function deleteUser(id) {
      if (!confirm('Точно удалить этого пользователя?')) return;

      const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message || data.error);
      loadUsers();
      renderActivity();
    }
    
    async function loadTrash() {
      const res = await fetch('/api/admin/trash');
      if (!res.ok) return;
      const { users, tasks } = await res.json();

      const usersBody = document.getElementById('trashUsersBody');
      usersBody.innerHTML = users.length
        ? users.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${escapeHtml(u.username)}</td>
              <td>${escapeHtml(u.role)}</td>
              <td>${new Date(u.deleted_at).toLocaleString()}</td>
              <td><button class="btn-sm btn-success" onclick="restoreItem('users', ${u.id})">Восстановить</button></td>
            </tr>
          `).join('')
        : '<tr><td colspan="5" style="color:#64748b;">Удалённых пользователей нет</td></tr>';

      const tasksBody = document.getElementById('trashTasksBody');
      tasksBody.innerHTML = tasks.length
        ? tasks.map(t => `
            <tr>
              <td>${t.id}</td>
              <td>${escapeHtml(t.title)}</td>
              <td>${escapeHtml(t.project_title)}</td>
              <td>${escapeHtml(t.author_name)}</td>
              <td>${new Date(t.deleted_at).toLocaleString()}</td>
              <td><button class="btn-sm btn-success" onclick="restoreItem('tasks', ${t.id})">Восстановить</button></td>
            </tr>
          `).join('')
        : '<tr><td colspan="6" style="color:#64748b;">Удалённых задач нет</td></tr>';
    }

     async function restoreItem(type, id) {
      const res = await fetch(`/api/admin/trash/${type}/${id}/restore`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) return alert(data.error || 'Ошибка восстановления');
      loadTrash();
      renderActivity();
    }

    async function renderActivity() {
      const res = await fetch('/api/admin/activity');
      if (!res.ok) return;
      const log = await res.json();
      const list = document.getElementById('activityList');
      if (!log.length) {
        list.innerHTML = '<li style="color:#64748b;">Записей пока нет</li>';
        return;
      }
      list.innerHTML = log.map(item => `
        <li style="padding:.5rem 0; border-bottom:1px solid #e2e8f0;">
          <strong>${escapeHtml(item.username || 'system')}</strong> —
          <span>${escapeHtml(item.action)}</span>
          ${item.details ? `<em>(${escapeHtml(item.details)})</em>` : ''}
          <span style="float:right; color:#64748b; font-size:.8rem;">${item.created_at}</span>
        </li>
      `).join('');
    }

    // Выход из системы
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    loadUsers();
    renderActivity();
  </script>
</body>
</html>
