<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Дашборд</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <h2 style="font-size:1.1rem; margin-bottom:1.5rem; color:#fff;">TaskFlow</h2>
      <nav class="side-nav">
        <a href="/dashboard.html" class="active">📊 Дашборд</a>
        <a href="/tasks.html">✅ Задачи</a>
        <a href="/projects.html">📁 Проекты</a>
        <a href="/admin.html" id="adminLink" style="display:none;">⚙️ Админ</a>
      </nav>
      <div class="side-user">
        <div id="userInfo">...</div>
        <button class="btn btn-ghost" id="logoutBtn"
                style="margin-top:.75rem; width:100%; color:#cbd5e1; border-color:#334155;">
          Выйти
        </button>
      </div>
    </aside>

    <main class="app-main">
      <h1>Мои задачи</h1>
      <p style="color:var(--muted);">Ближайшие дедлайны и активные задачи.</p>
      <div id="stats" style="display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); margin:1.5rem 0;"></div>
      <div class="tasks-grid" id="tasksGrid"></div>
    </main>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/tasks.js"></script>
</body>
</html>
