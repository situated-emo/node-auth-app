<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow — Задачи</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <h2 style="font-size:1.1rem; margin-bottom:1.5rem; color:#fff;">TaskFlow</h2>
      <nav class="side-nav">
        <a href="/dashboard.html">📊 Дашборд</a>
        <a href="/tasks.html" class="active">✅ Задачи</a>
        <a href="/projects.html">📁 Проекты</a>
        <a href="/admin.html" id="adminLink" style="display:none;">⚙️ Админ</a>
      </nav>
      <div class="side-user">
        <div id="userInfo">...</div>
        <button class="btn btn-ghost" id="logoutBtn" style="margin-top:.75rem; width:100%; color:#cbd5e1; border-color:#334155;">Выйти</button>
      </div>
    </aside>

    <main class="app-main">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
        <h1 style="margin:0;">Все задачи</h1>
        <button type="button" class="btn btn-primary" id="openCreateModalBtn" style="display:none; width:auto;">+ Создать задачу</button>
      </div>

      <div id="filtersBar" style="background:#fff; padding:1rem; border-radius:12px; border:1px solid var(--border); margin:1rem 0; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;">
        <input type="text" id="filterSearch" placeholder="Поиск по названию..." style="padding:.5rem; flex:1; min-width:200px;">

        <select id="filterStatus" style="padding:.5rem;">
          <option value="">Все статусы</option>
          <option value="todo">todo</option>
          <option value="in_progress">in_progress</option>
          <option value="review">review</option>
          <option value="done">done</option>
        </select>

        <select id="filterPriority" style="padding:.5rem;">
          <option value="">Все приоритеты</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="critical">critical</option>
        </select>

        <select id="filterAssignee" style="padding:.5rem; display:none;">
          <option value="">Все исполнители</option>
          <option value="unassigned">Без исполнителя</option>
        </select>

        <button type="button" class="btn btn-ghost" id="resetFiltersBtn" style="width:auto;">Сбросить</button>
      </div>

      <div id="stats" style="display:none;"></div>
      <div class="tasks-grid" id="tasksGrid"></div>
    </main>
  </div>

  <!-- Модальное окно создания задачи -->
  <div class="modal-backdrop" id="createTaskModal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="margin:0;">Новая задача</h2>
        <button type="button" class="btn btn-ghost" id="closeCreateModalBtn" style="width:auto;">✕</button>
      </div>

      <form id="createTaskForm">
        <div class="form-group">
          <label for="taskTitle">Название *</label>
          <input type="text" id="taskTitle" placeholder="Название задачи" required>
        </div>

        <div class="form-group">
          <label for="taskProject">Проект *</label>
          <select id="taskProject" required></select>
        </div>

        <div class="form-group">
          <label for="taskDescription">Описание</label>
          <textarea id="taskDescription" rows="3" placeholder="Описание задачи"></textarea>
        </div>

        <div class="form-group">
          <label for="taskPriority">Приоритет</label>
          <select id="taskPriority">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
            <option value="critical">critical</option>
          </select>
        </div>

        <div class="form-group">
          <label for="taskDueDate">Срок выполнения</label>
          <input type="date" id="taskDueDate">
        </div>

        <!-- Селект исполнителя для manager/admin -->
        <div class="form-group" id="assigneeSelectGroup" style="display:none;">
          <label for="taskAssigneeSelect">Исполнитель</label>
          <select id="taskAssigneeSelect">
            <option value="">Без исполнителя</option>
          </select>
        </div>

        <!-- Скрытое поле «исполнитель = я» для user -->
        <input type="hidden" id="taskAssigneeHidden" value="">

        <div style="display:flex; justify-content:flex-end; gap:.5rem; margin-top:1.25rem;">
          <button type="button" class="btn btn-ghost" id="cancelCreateModalBtn" style="width:auto;">Отмена</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Создать задачу</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/tasks.js"></script>
  <script>
    async function initTaskModal() {
      const user = await window.currentUser;
      if (!user || !['user', 'manager', 'admin'].includes(user.role)) return;

      const modal = document.getElementById('createTaskModal');
      const openBtn = document.getElementById('openCreateModalBtn');
      const closeBtn = document.getElementById('closeCreateModalBtn');
      const cancelBtn = document.getElementById('cancelCreateModalBtn');
      const isManagerOrAdmin = user.role === 'manager' || user.role === 'admin';

      openBtn.style.display = 'inline-flex';

      const openModal = () => modal.classList.add('open');
      const closeModal = () => modal.classList.remove('open');

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      const projRes = await fetch('/api/projects');
      if (projRes.ok) {
        const projects = await projRes.json();
        document.getElementById('taskProject').innerHTML = projects
          .map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`)
          .join('');
      }

      if (isManagerOrAdmin) {
        document.getElementById('assigneeSelectGroup').style.display = 'block';
        const usersRes = await fetch('/api/admin/users');
        if (usersRes.ok) {
          const users = await usersRes.json();
          document.getElementById('taskAssigneeSelect').innerHTML += users
            .map(u => `<option value="${u.id}">${escapeHtml(u.username)} (${escapeHtml(u.role)})</option>`)
            .join('');
        }
      } else {
        document.getElementById('taskAssigneeHidden').value = user.id;
      }

      document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const assigneeRaw = isManagerOrAdmin
          ? document.getElementById('taskAssigneeSelect').value
          : document.getElementById('taskAssigneeHidden').value;

        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: document.getElementById('taskTitle').value.trim(),
            project_id: Number(document.getElementById('taskProject').value),
            description: document.getElementById('taskDescription').value.trim() || null,
            priority: document.getElementById('taskPriority').value,
            due_date: document.getElementById('taskDueDate').value || null,
            assignee_id: assigneeRaw ? Number(assigneeRaw) : null
          })
        });

        if (res.ok) {
          e.target.reset();
          if (!isManagerOrAdmin) {
            document.getElementById('taskAssigneeHidden').value = user.id;
          }
          closeModal();
          renderTasks();
        } else {
          const err = await res.json();
          alert(err.error || 'Ошибка при создании задачи');
        }
      });
    }

    initTaskModal();
  </script>
</body>
</html>
